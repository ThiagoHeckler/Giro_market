spring:
  application:
    name: estoque-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ESTOQUE_DB_URL:jdbc:postgresql://localhost:5433/estoque}
    username: ${ESTOQUE_DB_USER:estoque}
    password: ${ESTOQUE_DB_PASSWORD:estoque}
  jpa:
    open-in-view: false
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway; o Hibernate só confere.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8081

outbox:
  # Respostas de reposição vão para o mercado.
  destino: ${MERCADO_EVENTOS_URL:http://localhost:8080}
  publicador-habilitado: true
  intervalo: 1s
  tamanho-lote: 50
  timeout: 2s
  backoff-maximo: 5m

tags:
  worker-url: ${TAG_WORKER_URL:http://localhost:8000}
  # Curto de propósito: a entrada de lote nunca espera pelo LLM mais que isso.
  timeout: 2s
  reclassificacao-habilitada: true
  intervalo-reclassificacao: 5m
  lote-reclassificacao: 20
