[project]
name = "tag-worker"
version = "0.1.0"
description = "Classificação de tags e categoria de produtos para posicionamento na vitrine (Girô)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "respx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
