spring:
  application:
    name: mercado-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MERCADO_DB_URL:jdbc:postgresql://localhost:15434/mercado}
    username: ${MERCADO_DB_USER:mercado}
    password: ${MERCADO_DB_PASSWORD:mercado}
  jpa:
    open-in-view: false
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway; o Hibernate só confere.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${MERCADO_PORTA:18080}

mercado:
  reserva:
    # Tempo que o item fica reservado entre o checkout e a confirmação do pagamento.
    ttl: 15m

outbox:
  # Pedidos de reposição vão para o estoque.
  destino: ${ESTOQUE_EVENTOS_URL:http://localhost:18081}
  publicador-habilitado: true
  intervalo: 1s
  tamanho-lote: 50
  timeout: 2s
  backoff-maximo: 5m

estoque:
  # Consulta síncrona usada só no cadastro de produto (nunca na venda).
  url: ${ESTOQUE_URL:http://localhost:18081}
  timeout: 2s
