spring:
  application:
    name: mercado-service
  config:
    # Em dev, os segredos vêm do .env da raiz (o mesmo que o compose lê). No contêiner o arquivo
    # não existe e valem as variáveis de ambiente.
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MERCADO_DB_URL:jdbc:postgresql://localhost:15434/mercado}
    username: ${MERCADO_DB_USER:mercado}
    password: ${MERCADO_DB_PASSWORD:mercado}
  jpa:
    open-in-view: false
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway; o Hibernate só confere.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${MERCADO_PORTA:18080}
  servlet:
    session:
      timeout: 8h
      cookie:
        # Nome próprio: em localhost os cookies não separam por porta, e o estoque tem o dele.
        name: MERCADO_SESSAO
        same-site: strict

seguranca:
  # Token que o mercado exige do estoque em /eventos.
  token-servico: ${MERCADO_TOKEN_SERVICO:}
  operador:
    usuario: ${OPERADOR_USUARIO:}
    senha: ${OPERADOR_SENHA:}

mercado:
  reserva:
    # Tempo que o item fica reservado entre o checkout e a confirmação do pagamento.
    ttl: 15m
    # Varredura que devolve à prateleira as reservas vencidas sem pagamento.
    expiracao-habilitada: true
    intervalo-expiracao: 30s
    lote-expiracao: 50

outbox:
  # Pedidos de reposição vão para o estoque.
  destino: ${ESTOQUE_EVENTOS_URL:http://localhost:18081}
  # Token que o estoque exige em /eventos.
  token: ${ESTOQUE_TOKEN_SERVICO:}
  publicador-habilitado: true
  intervalo: 1s
  tamanho-lote: 50
  timeout: 2s
  backoff-maximo: 5m

estoque:
  # Consulta síncrona usada só no cadastro de produto (nunca na venda).
  url: ${ESTOQUE_URL:http://localhost:18081}
  token: ${ESTOQUE_TOKEN_SERVICO:}
  timeout: 2s
