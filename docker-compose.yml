# Estoque 2.0 completo: um Postgres por serviço (sem FK cruzada), os dois serviços Java, o tag-worker
# e as duas UIs. Portas do host altas para não colidir com projetos locais; todas ajustáveis pelo .env.
# Desenvolvimento com os serviços fora do compose: docker compose up -d estoque-db mercado-db tag-worker
name: estoque-2-0

services:
  estoque-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: ${ESTOQUE_DB_USER:-estoque}
      POSTGRES_PASSWORD: ${ESTOQUE_DB_PASSWORD:-estoque}
    ports:
      - "${ESTOQUE_DB_PORTA:-15433}:5432"
    volumes:
      - estoque-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mercado-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercado
      POSTGRES_USER: ${MERCADO_DB_USER:-mercado}
      POSTGRES_PASSWORD: ${MERCADO_DB_PASSWORD:-mercado}
    ports:
      - "${MERCADO_DB_PORTA:-15434}:5432"
    volumes:
      - mercado-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  tag-worker:
    build: ./tag-worker
    environment:
      # Lida do .env (fora do git). Vazia: o worker usa o classificador por palavras-chave.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${TAG_WORKER_PORTA:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Estoque e mercado mandam eventos um para o outro, mas nenhum depende do outro para subir:
  # a outbox reenvia com backoff até o destino responder.
  estoque-service:
    build: ./estoque-service
    environment:
      ESTOQUE_DB_URL: jdbc:postgresql://estoque-db:5432/estoque
      ESTOQUE_DB_USER: ${ESTOQUE_DB_USER:-estoque}
      ESTOQUE_DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-estoque}
      MERCADO_EVENTOS_URL: http://mercado-service:8080
      TAG_WORKER_URL: http://tag-worker:8000
      # Segredos só do .env (fora do git); sem eles o compose nem sobe. Ver .env.example.
      ESTOQUE_TOKEN_SERVICO: ${ESTOQUE_TOKEN_SERVICO:?defina no .env (ver .env.example)}
      MERCADO_TOKEN_SERVICO: ${MERCADO_TOKEN_SERVICO:?defina no .env (ver .env.example)}
      OPERADOR_USUARIO: ${OPERADOR_USUARIO:?defina no .env (ver .env.example)}
      OPERADOR_SENHA: ${OPERADOR_SENHA:?defina no .env (ver .env.example)}
    ports:
      - "${ESTOQUE_PORTA:-18081}:8081"
    depends_on:
      estoque-db:
        condition: service_healthy
      # Só para a ordem de subida: sem o worker, o lote entra sem tags e é reclassificado depois.
      tag-worker:
        condition: service_started

  mercado-service:
    build: ./mercado-service
    environment:
      MERCADO_DB_URL: jdbc:postgresql://mercado-db:5432/mercado
      MERCADO_DB_USER: ${MERCADO_DB_USER:-mercado}
      MERCADO_DB_PASSWORD: ${MERCADO_DB_PASSWORD:-mercado}
      ESTOQUE_EVENTOS_URL: http://estoque-service:8081
      ESTOQUE_URL: http://estoque-service:8081
      # Segredos só do .env (fora do git); sem eles o compose nem sobe. Ver .env.example.
      ESTOQUE_TOKEN_SERVICO: ${ESTOQUE_TOKEN_SERVICO:?defina no .env (ver .env.example)}
      MERCADO_TOKEN_SERVICO: ${MERCADO_TOKEN_SERVICO:?defina no .env (ver .env.example)}
      OPERADOR_USUARIO: ${OPERADOR_USUARIO:?defina no .env (ver .env.example)}
      OPERADOR_SENHA: ${OPERADOR_SENHA:?defina no .env (ver .env.example)}
    ports:
      - "${MERCADO_PORTA:-18080}:8080"
    depends_on:
      mercado-db:
        condition: service_healthy

  vitrine-web:
    build:
      context: ./vitrine-web
      additional_contexts:
        design: ./design
    environment:
      API_UPSTREAM: http://mercado-service:8080
    ports:
      - "${VITRINE_PORTA:-15173}:8080"
    depends_on:
      mercado-service:
        condition: service_healthy

  estoque-web:
    build:
      context: ./estoque-web
      additional_contexts:
        design: ./design
      args:
        VITE_VITRINE_URL: http://localhost:${VITRINE_PORTA:-15173}
    environment:
      API_UPSTREAM: http://estoque-service:8081
    ports:
      - "${ESTOQUE_WEB_PORTA:-15174}:8080"
    depends_on:
      estoque-service:
        condition: service_healthy

volumes:
  estoque-db-data:
  mercado-db-data:
