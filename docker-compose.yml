# Passo 1: só o Postgres do estoque. Os demais serviços entram nos próximos passos.
name: estoque-2-0

services:
  estoque-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: ${ESTOQUE_DB_USER:-estoque}
      POSTGRES_PASSWORD: ${ESTOQUE_DB_PASSWORD:-estoque}
    ports:
      # 5433 no host: a 5432 fica para o Postgres do mercado.
      - "5433:5432"
    volumes:
      - estoque-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  estoque-db-data:
